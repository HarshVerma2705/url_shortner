# Nginx template
#
# This is a PROJECT TEMPLATE.
# Do not blindly overwrite /etc/nginx/sites-enabled/coderunner
# because Certbot manages the TLS portions of the production config.
#
# Production flow:
#   /api/*       -> Express on 127.0.0.1:3000
#   /<shortcode> -> Express on 127.0.0.1:3000
#   everything else -> React static build

server {
    listen 80;
    listen [::]:80;

    server_name coderunner.me www.coderunner.me;

    # In production, Certbot normally redirects this server to HTTPS.
    # Keep TLS/certificate directives in the Certbot-managed configuration.

    root /var/www/coderunner;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React routes such as /dashboard, /login, /register
    location ~ ^/(dashboard|login|register)/?$ {
        try_files $uri $uri/ /index.html;
    }

    # Short links such as /abc123
    location / {
        try_files $uri $uri/ @shorturl;
    }

    location @shorturl {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
